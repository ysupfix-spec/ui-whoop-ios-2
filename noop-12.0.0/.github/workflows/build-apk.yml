# Manual APK build for testing the WHOOP-style theme. Produces an installable debug APK.
name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build full debug APK
        run: chmod +x ./gradlew && ./gradlew assembleFullDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noop-whoop-debug-apk
          path: android/app/build/outputs/apk/full/debug/*.apk
